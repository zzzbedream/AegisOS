[package]
name = "aegis-chain"
version = "0.1.0"
edition = "2021"
publish = false

# A plain library shared by aegis-account and aegis-proof: the payment chain
# and the range Merkle tree must be byte-identical in both, and in TypeScript.
[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
